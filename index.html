<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elie3M Business</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --primary: #0f766e;
    --primary-dark: #0b5b55;
    --bg: #f5f7f6;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --danger: #b91c1c;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #111827; --card: #1f2937; --text: #f9fafb; --muted: #9ca3af; --border: #374151; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  header.top {
    background: var(--primary); color: #fff; padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    position: sticky; top: 0; z-index: 10;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
  }
  header.top .brand { font-weight: 700; font-size: 18px; color: #fff; text-decoration: none; }
  header.top .logo { height: 40px; width: auto; background: #fff; border-radius: 8px; padding: 4px 8px; display: block; }
  main { max-width: 760px; margin: 0 auto; padding: 18px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; border: 1px solid var(--border); }
  h1 { font-size: 22px; margin: 8px 0 12px; }
  h2 { font-size: 18px; margin: 0 0 10px; }
  p { line-height: 1.5; }
  button, .btn {
    background: var(--primary); color: #fff; border: none; padding: 10px 16px;
    border-radius: 8px; font-size: 15px; cursor: pointer; text-decoration: none; display: inline-block;
  }
  button:hover { background: var(--primary-dark); }
  button.secondary { background: var(--card); color: var(--primary); border: 1px solid var(--primary); }
  button.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.5); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
  input, textarea, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 16px; font-family: inherit; background: var(--card); color: var(--text);
  }
  textarea { min-height: 90px; resize: vertical; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .msg { font-size: 14px; margin-top: 10px; min-height: 1em; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--primary); }
  .hidden { display: none !important; }
  .grid-2 { display: grid; grid-template-columns: 1fr; gap: 0 14px; }
  @media (min-width: 620px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
  .badge { display: inline-block; font-size: 12px; padding: 3px 8px; border-radius: 999px; background: #fef3c7; color: #92400e; }
  .badge.ok { background: #d1fae5; color: #065f46; }
  .muted { color: var(--muted); font-size: 14px; }
  .url-box { font-family: monospace; font-size: 14px; background: var(--bg); padding: 10px; border-radius: 8px; word-break: break-all; margin-top: 10px; }

  /* Modèle vitrine */
  .site { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); background: var(--card); }
  .site-hero { background: var(--primary); color: #fff; padding: 28px 20px; text-align: center; }
  .site-hero h1 { margin: 0; font-size: 26px; }
  .site-hero .cat { opacity: .85; font-size: 14px; margin-top: 4px; }
